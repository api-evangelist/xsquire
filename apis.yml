name: XSquare
description: XSquare (listed as XSquire in the 500 Global portfolio) is a Dubai-based
  B2B financial operations platform for the GCC, live across the UAE and Qatar. It
  unifies e-invoicing, receivables collection via embedded payment links and QR codes
  (card, Apple Pay, Google Pay, bank), supplier payables on corporate card, and
  automatic invoice-to-payment reconciliation on a single ledger, with native ERP
  integrations (Zoho, Xero, Wafeq, Odoo) and a PSP network (Tess, Telr, Geidea).
  PCI DSS Level 1 v4 certified, UAE FTA e-invoicing ready (PEPPOL, structured XML),
  and non-custodial by design through licensed PSP partners regulated by CBUAE and
  QCB. Founded in 2023 by Tanvir Shah and Ashwin Shenoy; operates as XSquare Payment
  Services LLC (Dubai) and XSquare LLC (Doha). No public developer API, docs, or
  SDKs are published as of July 2026.
